<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="Arial, Helvetica, sans-serif" role="img">
  <title>Where to keep your gocryptfs passphrase</title>
  <desc>Ranked options from best to never: password manager, memorized diceware passphrase, written and locked away as last resort, and never plaintext files or sticky notes</desc>
  <defs>
    <filter id="spl" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <text x="440" y="34" text-anchor="middle" fill="#003366" font-size="16" font-weight="bold">Where should your gocryptfs passphrase live?</text>

  <!-- Best -->
  <g filter="url(#spl)">
    <rect x="60" y="56" width="760 " height="76" rx="10" fill="#EAF6EC" stroke="#28A745" stroke-width="2"/>
    <rect x="60" y="56" width="180" height="76" rx="10" fill="#28A745"/>
    <text x="150" y="90" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">BEST</text>
    <text x="150" y="112" text-anchor="middle" fill="#fff" font-size="12">use this</text>
    <text x="270" y="86" fill="#1E5B2E" font-size="13.5" font-weight="bold">Password manager (e.g., Bitwarden)</text>
    <text x="270" y="110" fill="#1E5B2E" font-size="12.5">Generated, unique, backed up, shareable with your lab via a collection</text>
  </g>

  <!-- Good -->
  <g filter="url(#spl)">
    <rect x="60" y="146" width="760" height="76" rx="10" fill="#EAF1F7" stroke="#004B87" stroke-width="2"/>
    <rect x="60" y="146" width="180" height="76" rx="10" fill="#004B87"/>
    <text x="150" y="180" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">GOOD</text>
    <text x="150" y="202" text-anchor="middle" fill="#fff" font-size="12">solid fallback</text>
    <text x="270" y="176" fill="#003366" font-size="13.5" font-weight="bold">Memorized diceware passphrase</text>
    <text x="270" y="200" fill="#003366" font-size="12.5">5+ random words, 14+ characters -- e.g. "coral-lantern-drift-mesa-copper"</text>
  </g>

  <!-- Last resort -->
  <g filter="url(#spl)">
    <rect x="60" y="236" width="760" height="76" rx="10" fill="#FFF4E8" stroke="#FD7E14" stroke-width="2"/>
    <rect x="60" y="236" width="180" height="76" rx="10" fill="#FD7E14"/>
    <text x="150" y="270" text-anchor="middle" fill="#000" font-size="15" font-weight="bold">LAST RESORT</text>
    <text x="150" y="292" text-anchor="middle" fill="#000" font-size="12">only if you must</text>
    <text x="270" y="266" fill="#8A4A0B" font-size="13.5" font-weight="bold">Written down -- sealed and physically locked away</text>
    <text x="270" y="290" fill="#8A4A0B" font-size="12.5">No hints on the paper about what it unlocks; separate from your office</text>
  </g>

  <!-- Never -->
  <g filter="url(#spl)">
    <rect x="60" y="326" width="760" height="76" rx="10" fill="#FDECEF" stroke="#DC3545" stroke-width="2"/>
    <rect x="60" y="326" width="180" height="76" rx="10" fill="#DC3545"/>
    <text x="150" y="360" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">NEVER</text>
    <text x="150" y="382" text-anchor="middle" fill="#fff" font-size="12">breach waiting</text>
    <text x="270" y="356" fill="#8B1E2C" font-size="13.5" font-weight="bold">Sticky notes, plaintext files, emails, chat messages, script literals</text>
    <text x="270" y="380" fill="#8B1E2C" font-size="12.5">(A chmod-600 passfile for batch jobs is the one scripted exception -- see Episode 10)</text>
  </g>
</svg>
