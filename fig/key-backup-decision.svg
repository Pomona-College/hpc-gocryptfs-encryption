<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" font-family="Arial, Helvetica, sans-serif" role="img">
  <title>gocryptfs key backup decision flow</title>
  <desc>Initializing gocryptfs creates gocryptfs.conf; backing it up to multiple locations is critical because losing it makes data unrecoverable</desc>
  <defs>
    <filter id="skb" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <marker id="akb" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#003366"/>
    </marker>
  </defs>

  <!-- init -->
  <g filter="url(#skb)">
    <rect x="290" y="20" width="240" height="46" rx="8" fill="#003366"/>
    <text x="410" y="48" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold" font-family="monospace">gocryptfs -init</text>
  </g>
  <path d="M 410,66 L 410,94" fill="none" stroke="#003366" stroke-width="1.8" marker-end="url(#akb)"/>

  <!-- conf created -->
  <g filter="url(#skb)">
    <rect x="230" y="98" width="360" height="64" rx="8" fill="#EAF1F7" stroke="#004B87" stroke-width="2"/>
    <text x="410" y="123" text-anchor="middle" fill="#003366" font-size="13.5" font-weight="bold">Creates gocryptfs.conf</text>
    <text x="410" y="146" text-anchor="middle" fill="#003366" font-size="12.5">holds your master key, encrypted with your password</text>
  </g>
  <path d="M 410,162 L 410,192 " fill="none" stroke="#003366" stroke-width="1.8" marker-end="url(#akb)"/>

  <!-- decision -->
  <g filter="url(#skb)">
    <polygon points="410,196 560,266 410,336 260,266" fill="#D4A843" stroke="#004B87" stroke-width="2"/>
    <text x="410" y="258" text-anchor="middle" fill="#000" font-size="13.5" font-weight="bold">Back up</text>
    <text x="410" y="280" text-anchor="middle" fill="#000" font-size="13.5" font-weight="bold">gocryptfs.conf?</text>
  </g>

  <!-- yes branch -->
  <path d="M 260,266 Q 180,266 180,320 L 180,352" fill="none" stroke="#003366" stroke-width="1.8" marker-end="url(#akb)"/>
  <text x="150" y="310" fill="#1E5B2E" font-size="12.5" font-weight="bold">YES — critical</text>
  <g filter="url(#skb)">
    <rect x="40" y="356" width="280" height="64" rx="8" fill="#EAF6EC" stroke="#28A745" stroke-width="2"/>
    <text x="180" y="381" text-anchor="middle" fill="#1E5B2E" font-size="12.5" font-weight="bold">Copy to a backup directory in /rhome</text>
    <text x="180" y="402" text-anchor="middle" fill="#1E5B2E" font-size="12" font-family="monospace">cp gocryptfs.conf ~/backup/  (chmod 600)</text>
  </g>
  <path d="M 180,420 L 180,450" fill="none" stroke="#003366" stroke-width="1.8" marker-end="url(#akb)"/>
  <g filter="url(#skb)">
    <rect x="40" y="454" width="280" height="64" rx="8" fill="#EAF6EC" stroke="#28A745" stroke-width="2"/>
    <text x="180" y="479" text-anchor="middle" fill="#1E5B2E" font-size="12.5" font-weight="bold">Also export to a secure off-cluster location</text>
    <text x="180" y="500" text-anchor="middle" fill="#1E5B2E" font-size="12">encrypted USB, key escrow with ITS, …</text>
  </g>

  <!-- no branch -->
  <path d="M 560,266 Q 640,266 640,320 L 640,352" fill="none" stroke="#003366" stroke-width="1.8" marker-end="url(#akb)"/>
  <text x="650" y="310" fill="#8B1E2C" font-size="12.5" font-weight="bold">NO / skipped</text>
  <g filter="url(#skb)">
    <rect x="500" y="356" width="280" height="88" rx="8" fill="#FDECEF" stroke="#DC3545" stroke-width="2"/>
    <text x="640" y="382" text-anchor="middle" fill="#8B1E2C" font-size="13" font-weight="bold">One corrupted or deleted file away</text>
    <text x="640" y="402" text-anchor="middle" fill="#8B1E2C" font-size="13" font-weight="bold">from PERMANENT data loss</text>
    <text x="640" y="428" text-anchor="middle" fill="#8B1E2C" font-size="12">No conf = no decryption, even with the password</text>
  </g>

  <!-- warning banner -->
  <g filter="url(#skb)">
    <rect x="425" y="480" width="355" height="52" rx="8" fill="#DC3545"/>
    <text x="602" y="502" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">WARNING: if gocryptfs.conf is lost,</text>
    <text x="602" y="521" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">your data is unrecoverable — forever</text>
  </g>
</svg>
