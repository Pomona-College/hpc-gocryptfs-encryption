<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="Arial, Helvetica, sans-serif" role="img">
  <title>Daily gocryptfs mount cycle</title>
  <desc>Mount with your passphrase, work in the plain directory, unmount when done, data rests encrypted overnight</desc>
  <defs>
    <filter id="sdc" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <marker id="adc" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#003366"/>
    </marker>
  </defs>

  <!-- Step 1: Mount -->
  <g filter="url(#sdc)">
    <rect x="30" y="60" width="195" height="110" rx="10" fill="#EAF1F7" stroke="#004B87" stroke-width="2"/>
    <rect x="30" y="60" width="195" height="32" rx="10" fill="#004B87"/>
    <rect x="30" y="78" width="195" height="14" fill="#004B87"/>
    <text x="127" y="81" text-anchor="middle" fill="#fff" font-size="13.5" font-weight="bold">1. Mount (morning)</text>
    <text x="127" y="116" text-anchor="middle" fill="#003366" font-size="11">srun --pty bash, then:</text>
    <text x="127" y="138" text-anchor="middle" fill="#003366" font-size="10.5" font-family="monospace">mkdir -p /scratch/$USER/plain</text>
    <text x="127" y="158" text-anchor="middle" fill="#003366" font-size="10.5" font-family="monospace">gocryptfs cipher plain</text>
  </g>
  <path d="M 225,115 L 255,115" fill="none" stroke="#003366" stroke-width="1.8" marker-end="url(#adc)"/>

  <!-- Step 2: Work -->
  <g filter="url(#sdc)">
    <rect x="260" y="60" width="195" height="110" rx="10" fill="#EAF6EC" stroke="#28A745" stroke-width="2"/>
    <rect x="260" y="60" width="195" height="32" rx="10" fill="#28A745"/>
    <rect x="260" y="78" width="195" height="14" fill="#28A745"/>
    <text x="357" y="81" text-anchor="middle" fill="#fff" font-size="13.5" font-weight="bold">2. Work (all day)</text>
    <text x="357" y="116" text-anchor="middle" fill="#1E5B2E" font-size="12">Use files in the plain dir</text>
    <text x="357" y="138" text-anchor="middle" fill="#1E5B2E" font-size="12">Scripts, analysis, jobs --</text>
    <text x="357" y="158" text-anchor="middle" fill="#1E5B2E" font-size="12">encryption is invisible</text>
  </g>
  <path d="M 455,115 L 485,115" fill="none" stroke="#003366" stroke-width="1.8" marker-end="url(#adc)"/>

  <!-- Step 3: Unmount -->
  <g filter="url(#sdc)">
    <rect x="490" y="60" width="195" height="110" rx="10" fill="#EAF1F7" stroke="#004B87" stroke-width="2"/>
    <rect x="490" y="60" width="195" height="32" rx="10" fill="#004B87"/>
    <rect x="490" y="78" width="195" height="14" fill="#004B87"/>
    <text x="587" y="81" text-anchor="middle" fill="#fff" font-size="13.5" font-weight="bold">3. Unmount (evening)</text>
    <text x="587" y="116" text-anchor="middle" fill="#003366" font-size="11.5" font-family="monospace">fusermount -u .../plain</text>
    <text x="587" y="138" text-anchor="middle" fill="#003366" font-size="12">Plain view disappears</text>
    <text x="587" y="158" text-anchor="middle" fill="#003366" font-size="12">Passphrase forgotten</text>
  </g>
  <path d="M 685,115 L 715,115" fill="none" stroke="#003366" stroke-width="1.8" marker-end="url(#adc)"/>

  <!-- Step 4: At rest -->
  <g filter="url(#sdc)">
    <rect x="720" y="60" width="160" height="110" rx="10" fill="#FDECEF" stroke="#DC3545" stroke-width="2"/>
    <rect x="720" y="60" width="160" height="32" rx="10" fill="#DC3545"/>
    <rect x="720" y="78" width="160" height="14" fill="#DC3545"/>
    <text x="800" y="81" text-anchor="middle" fill="#fff" font-size="13.5" font-weight="bold">4. At rest (night)</text>
    <text x="800" y="118" text-anchor="middle" fill="#8B1E2C" font-size="12">Only encrypted</text>
    <text x="800" y="138" text-anchor="middle" fill="#8B1E2C" font-size="12">data on disk --</text>
    <text x="800" y="158" text-anchor="middle" fill="#8B1E2C" font-size="12">safe unattended</text>
  </g>

  <!-- Loop back arrow -->
  <path d="M 800,170 L 800,250 Q 800,270 780,270 L 147,270 Q 127,270 127,250 L 127,175" fill="none" stroke="#003366" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#adc)"/>
  <text x="463" y="292" text-anchor="middle" fill="#003366" font-size="12" font-style="italic">next morning: mount again</text>

  <!-- Rule banner -->
  <g filter="url(#sdc)">
    <rect x="180" y="320" width="540" height="44" rx="8" fill="#D4A843" stroke="#004B87" stroke-width="2"/>
    <text x="450" y="338" text-anchor="middle" fill="#000" font-size="12.5" font-weight="bold">Rule of thumb: mounted = usable but exposed to your session;</text>
    <text x="450" y="356" text-anchor="middle" fill="#000" font-size="12.5" font-weight="bold">unmounted = protected. Mount on /scratch, in a compute session.</text>
  </g>
</svg>
